# Minimal operating-engine regression gate (no network required).
name: minimal-gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest fastapi httpx pillow
      - name: Minimal gate
        run: bash scripts/minimal_gate.sh
