<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Wallbreaker</title>
    <style>
      :root {
        --bg: #0b0809;
        --brand: #ff3b47;
        --accent: #2de2c8;
        --text: #ece0e1;
        --muted: #a07478;
        --panel: #20151a;
        --border: #3a2126;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: radial-gradient(1000px 500px at 80% -10%, #1a0e12 0%, var(--bg) 55%);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .card {
        width: min(720px, 100%);
        background: linear-gradient(180deg, #17100f, #120c0e);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 28px 22px;
        box-shadow: 0 20px 60px rgba(0,0,0,.45);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 1.2px;
        margin-bottom: 18px;
      }
      .mark { color: var(--brand); font-size: 22px; }
      .word b { color: var(--brand); }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #3a2126;
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
        margin: 22px 0 10px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      pre {
        margin-top: 18px;
        max-height: 320px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        background: #0e0a0b;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        color: #d7b4b8;
        font: 12px/1.45 ui-monospace, "SF Mono", Consolas, monospace;
      }
      .foot {
        margin-top: 16px;
        font-size: 12px;
        color: #74595d;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="brand">
          <span class="mark">◆</span>
          <span class="word">WALL<b>BREAKER</b></span>
        </div>
        <h1 id="title">Starting desktop shell</h1>
        <p id="subtitle">Booting local agent backend and dashboard…</p>
        <div class="spinner" id="spin"></div>
        <pre id="msg" hidden></pre>
        <div class="foot">authorized testing only · break the wall · not the rules of engagement</div>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      let raw = params.get("msg") || "Starting Wallbreaker backend…";
      try { raw = decodeURIComponent(raw); } catch (_) {}
      const isError = /fail|error|timed out/i.test(raw);
      document.getElementById("title").textContent = isError ? "Backend failed" : "Starting desktop shell";
      document.getElementById("subtitle").textContent = isError
        ? "Fix the environment, then use File → Restart Backend."
        : "Booting local agent backend and dashboard…";
      if (isError) {
        document.getElementById("spin").style.display = "none";
        const pre = document.getElementById("msg");
        pre.hidden = false;
        pre.textContent = raw;
      }
    </script>
  </body>
</html>
